# Base configuration for all forward-model rows of Table 1.
# Row yamls in configs/forward/ inherit from this file (base_config:) and
# override only what differs. Values here are the ones the paper's runs
# actually used (verified against the runs' logged configs); note the paper
# text's "150 epochs, batch 16" — the logged runs used 300 epochs, batch 64.

# ---- paths (edit these for your machine) ----
data_root: data/corpora/            # parent dir of the simulated corpora (see data/README.md)
path_to_root_data_folder: data/corpora/   # where dataset_ff_stats.csv is cached
split_dir: splits/
path_to_split: splits/random_split.pth
checkpoints_path: checkpoints/
path_to_save_model_weights: GNN_ff_forward_34_34.pt
trained_model_path: None

# ---- data ----
data_set_name: FMNIST_CIFAR
dataset_variant: random             # random | pca | big | mixed | hardest_pca_100 |
                                    # hardest_pca_500 | classic_square |
                                    # classic_square_parasitic | classic_rectangle
data_set_type: pixel_data
length_unit: "mm"
frequencies: [2400, 2800, 5200, 5600, 6000]
frequencies_in_scale: [2.4e9, 2.8e9, 5.2e9, 5.6e9, 6.0e9]
train_freq_idxs: [1, 2, 3, 4]
idx_freq: 3                         # 5600 MHz — the paper's operating frequency
multipule_freqs: false
use_freq_conditioning: false
freq_mode: 'fixed'
threshold: 0.5

# frequency-conditioning embedding (only read when use_freq_conditioning is on)
freq_num_bands: 4
freq_max_cycles: 2.0
freq_k_margin: 0.25

# ---- hardware ----
device_num: '0'

# ---- run mode ----
load_from_checkpoint: false
load_trained_model: false
train: true
test: true
seed: 0

# ---- model / graph ----
model_type: GPS
radiation_image_shape: [34, 34, 1]
edge_feature_size: 4                # 4 = relative-position edges; 5 adds the
                                    # component-bridge type column (connect_components)
connect_components: None
per_component_interpolation: true
strict_pe_check: true
raw_node_feture_size: 17
add_radius_graph_edges: true
merge_duplicate_nodes: true
use_node_probs: false
physical_antenna: true
gps: true
hetero_graph: false
add_sphere: false
sphere_radius: 400
adapt_output_size: true
pointcloud_model: false

# ---- PAIS / decoder / physics flags (Sec. 4.1) ----
predict_surface_current: true       # PAIS on/off
ff_loss_weight: 0.9                 # lambda_F (plain PAIS: 0.9 / 0.1)
surface_current_loss_weight: 0.1    # lambda_J
shuffle_surface_currents: false     # 'shuffled SC' control
position_auxiliary_task: false      # 'pos. aux' control
direction_conditioned_decoder: false
use_current_in_direction_decoder: false
use_physics_loss: false             # lambda_phys term (weight 0.3, warmup 2000 steps)
residual_scale: 0.1                 # s in Eq. (3); 0.0 = residual-off ablation
pred_s11_single_freq: false         # S11 auxiliary head (extension, not in the paper)
s11_loss_weight: 0.5

# ---- training (AdamW, linear warmup + cosine annealing to 1e-6) ----
total_epochs: 300
batch_size: 64
base_lr: 0.0002
optimizer_weight_decay: 0.00001
warmup_epochs: 5
number_of_validation_samples: 15
dropout: 0.0

# ---- legacy keys still read by the trainer (values as in the paper runs) ----
learning_rate: 0.00001        # unused by the AdamW path; kept for trainer compatibility
weight_decay: 0.0001
gamma: 0.99
num_epochs: 2000              # legacy epoch key; the forward path uses total_epochs
gnn_out_feature_size: 256
output_in_DB: true
interval_checkpoint_dir: None
s11_db_weight: 0.01
number_of_bootstrap_iterations: 100

# ---- augmentation (all off for the paper's runs) ----
k_sphere_neighbores: 2
num_sphere_nodes: 162
augment_shift: 0
augment_rotation: false
augment_compress_towards_threshold: false
